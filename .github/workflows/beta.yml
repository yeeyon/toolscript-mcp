# Moves the beta branch to the main commit, after every job of test.yml passes
# on it. People who test toolscript-mcp before a release clone that branch and
# run `npm ci` (README, "From GitHub (beta)").
#
# Start it from the Actions tab: Run workflow, branch main. beta only ever
# points at a commit of main, so the history of main stays the source.
name: beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  promote:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Refuse a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Move beta from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move beta to this commit
        run: |
          git push --force origin "$GITHUB_SHA:refs/heads/beta"
          echo "beta is now $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
