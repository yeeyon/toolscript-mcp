# Runs the checks of CODING_STANDARDS.md: the pure-core tests, the build and
# the server end to end on three systems, the real sandbox, the package, the
# types and the format. release.yml calls it before it publishes.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # 22.13 is the first Node with a stable --permission flag.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24']
    name: ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # The Windows cases that compile the child guard program raise a Defender audit event for each new program, so a
      # laptop skips them. CI runs them: tests/childguard.test.ts, tests/lazy.e2e.mjs and tests/memory.e2e.mjs.
      - name: Turn on the Windows child guard cases
        if: runner.os == 'Windows'
        shell: bash
        run: echo "TOOLSCRIPT_TEST_CHILD_GUARD=1" >> "$GITHUB_ENV"
      # A vfat volume has short names such as GIT~1: the alias test of tests/workspace-fs.test.ts runs on it.
      - name: Mount a vfat image for the alias test
        if: runner.os == 'Linux'
        run: |
          command -v mkfs.vfat >/dev/null || { sudo apt-get update && sudo apt-get install -y dosfstools; }
          truncate -s 8M "$RUNNER_TEMP/alias.img"
          sudo "$(command -v mkfs.vfat || echo /sbin/mkfs.vfat)" "$RUNNER_TEMP/alias.img"
          mkdir "$RUNNER_TEMP/alias"
          sudo mount -o loop,uid=$(id -u),gid=$(id -g) "$RUNNER_TEMP/alias.img" "$RUNNER_TEMP/alias"
          echo "TOOLSCRIPT_TEST_ALIAS_DIR=$RUNNER_TEMP/alias" >> "$GITHUB_ENV"
      # A case-sensitive APFS image: tests/workspace-roots-fs.test.ts holds `app` and `App` there as two folders.
      - name: Attach a case-sensitive APFS image
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 16m -fs "Case-sensitive APFS" -volname casefs "$RUNNER_TEMP/case.dmg"
          mkdir "$RUNNER_TEMP/case"
          hdiutil attach "$RUNNER_TEMP/case.dmg" -mountpoint "$RUNNER_TEMP/case" -nobrowse
          echo "TOOLSCRIPT_TEST_CASE_DIR=$RUNNER_TEMP/case" >> "$GITHUB_ENV"
      # A casefolded ext4 folder opens .ſſh as .ssh: the casefold test of tests/workspace-fs.test.ts runs on it.
      - name: Mount a casefolded ext4 image
        if: runner.os == 'Linux'
        run: |
          truncate -s 16M "$RUNNER_TEMP/fold.img"
          mkfs.ext4 -q -O casefold "$RUNNER_TEMP/fold.img"
          mkdir "$RUNNER_TEMP/fold"
          sudo mount -o loop "$RUNNER_TEMP/fold.img" "$RUNNER_TEMP/fold"
          sudo chown $(id -u):$(id -g) "$RUNNER_TEMP/fold"
          mkdir "$RUNNER_TEMP/fold/dir"
          chattr +F "$RUNNER_TEMP/fold/dir"
          echo "TOOLSCRIPT_TEST_CASEFOLD_DIR=$RUNNER_TEMP/fold/dir" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - run: node tests/server.e2e.mjs
      # The workspace tests of `npm test` and this end-to-end test run on Linux, macOS and Windows. The macOS run shows
      # whether O_NOFOLLOW_ANY refuses a symlink in a middle part.
      - run: node tests/workspace.e2e.mjs
      - run: node tests/memory.e2e.mjs
      - run: node tests/share.e2e.mjs
      - run: node tests/lazy.e2e.mjs
      - run: node --experimental-strip-types tests/broker.integration.ts
      - run: node scripts/pack-check.mjs

  sandbox:
    # The network block is sandbox-exec on macOS and unshare -rn on Linux.
    # Windows has none, and the test checks that it is absent there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24']
    name: sandbox ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Ubuntu 24.04 lets no user make a user namespace (AppArmor), so the
      # Linux network block would not run. Allow it, to test that layer.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: node tests/runner.integration.mjs
        env:
          EXPECT_NETWORK_BLOCK: ${{ runner.os != 'Windows' && '1' || '' }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check

  format:
    # A commit without the pre-commit hook of .githooks/ fails here. The
    # image has Node, so the job needs no setup-node.
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/format.sh --check .
