# Runs the checks of CODING_STANDARDS.md: the pure-core tests, the build and
# the server end to end on three systems, the real sandbox, the types and the
# format.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 22.13 is the first Node with a stable --permission flag.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24']
    name: ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node tests/server.e2e.mjs

  sandbox:
    # The network block is sandbox-exec on macOS and unshare -rn on Linux.
    # Windows has none, and the test checks that it is absent there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24']
    name: sandbox ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Ubuntu 24.04 lets no user make a user namespace (AppArmor), so the
      # Linux network block would not run. Allow it, to test that layer.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: node tests/runner.integration.mjs
        env:
          EXPECT_NETWORK_BLOCK: ${{ runner.os != 'Windows' && '1' || '' }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check

  format:
    # A commit without the pre-commit hook of .githooks/ fails here. The
    # image has Node, so the job needs no setup-node.
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/format.sh --check .
