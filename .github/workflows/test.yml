# Probe branch macos-cpu-probe only, never merged: the jobs of main are
# replaced by one probe of why the CPU limit (ulimit -t) sometimes loses to
# the host kill timer on macOS. See scripts/probe-cpu-limit.mjs.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    name: probe macos-latest node ${{ matrix.node }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node scripts/probe-cpu-limit.mjs
