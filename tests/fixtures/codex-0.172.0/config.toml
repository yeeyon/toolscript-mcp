[mcp_servers.files]
command = "npx"
args = ["-y", "@example/files-server", "--root", "/tmp/x"]
env_vars = ["HOME_TOKEN"]
cwd = "/tmp"

[mcp_servers.files.env]
API_KEY = "literal-secret-value"
MODE = "fast"

[mcp_servers.docs]
url = "https://example.com/mcp"
bearer_token_env_var = "DOCS_TOKEN"
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled_tools = ["a", "b"]

[mcp_servers.hdr]
url = "https://example.com/hdr"
http_headers = { "X-Api-Key" = "literal-header-secret" }
env_http_headers = { "X-Org" = "ORG_VAR" }
disabled_tools = ["danger"]

[mcp_servers.oauthy]
url = "https://example.com/oauth"

[mcp_servers.off]
command = "node"
args = ["x.js"]
enabled = false

[mcp_servers."with space"]
command = "node"
